<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vehicle Monitor Login</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f4f4f2; color: #1d1d1b; display: grid; place-items: center; min-height: 100vh; margin: 0; }
  form { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 24px; width: min(320px, 90vw); display: grid; gap: 12px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  input, button { font: inherit; padding: 8px 10px; border-radius: 6px; border: 1px solid #bbb; }
  button { background: #1d1d1b; color: #fff; border: 0; cursor: pointer; }
  .bad { font-size: 14px; display: none; }
</style>
</head>
<body>
<form method="post" action="/login">
  <h1>Team 2 vehicle monitor</h1>
  <p class="bad" id="bad">Wrong username or password.</p>
  <input name="username" placeholder="Username" autocomplete="username" required>
  <input name="password" type="password" placeholder="Password" autocomplete="current-password" required>
  <button type="submit">Log in</button>
</form>
<script>if (location.search.includes("bad")) document.getElementById("bad").style.display = "block";</script>
</body>
</html>
