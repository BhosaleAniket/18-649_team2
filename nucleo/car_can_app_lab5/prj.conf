# Drivers
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_CAN=y
CONFIG_CAN_MCP2515=y
CONFIG_PWM=y
CONFIG_WATCHDOG=y

# MCP2515 interrupt thread. It is a cooperative thread (K_PRIO_COOP(2)),
# so it runs above every preemptible thread in this app; our RX callback
# runs inside it. 1024 is the driver default, stated here so it is visible.
CONFIG_CAN_MCP2515_INT_THREAD_PRIO=2
CONFIG_CAN_MCP2515_INT_THREAD_STACK_SIZE=1024

# Console (USART2 on the ST-LINK USB) for the 1 s status report
CONFIG_PRINTK=y
CONFIG_SERIAL=y

# PID (N3) uses float; save FP context when float threads preempt each other
CONFIG_FPU=y
CONFIG_FPU_SHARING=y

# Stack checking while developing; costs a little time per context switch
CONFIG_HW_STACK_PROTECTION=y

# Lab 5: 64-bit microsecond clock for time sync (SysTick at 84 MHz)
CONFIG_CORTEX_M_SYSTICK_64BIT_CYCLE_COUNTER=y
